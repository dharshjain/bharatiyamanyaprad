name: Keep Supabase Active

on:
  schedule:
    # Runs at 00:00 UTC every 3 days (Supabase free projects pause after 7 days of inactivity)
    - cron: "0 0 */3 * *"
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://ykzbptfiyyzskfijbniu.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_kFHKnlrAzSQrr0fvXQ0h2A_yCeBt1Fy' }}
        run: |
          echo "Pinging Supabase project at ${SUPABASE_URL}..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/site_stats?select=id&limit=1")

          echo "HTTP Response Status: ${HTTP_STATUS}"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Successfully pinged Supabase! Project activity refreshed."
          else
            echo "Error: Failed to ping Supabase (HTTP Status: ${HTTP_STATUS})"
            exit 1
          fi
